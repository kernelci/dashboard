name: Publish GHCR Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: true
        type: string

concurrency:
  group: publish-ghcr-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve-ref:
    if: github.repository == 'kernelci/dashboard' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.git.outputs.sha }}
    steps:
      - name: Resolve commit SHA
        id: git
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build-and-push-backend:
    if: github.repository == 'kernelci/dashboard' || github.event_name == 'workflow_dispatch'
    needs: resolve-ref
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Compute image prefix
        id: meta
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/dashboard-backend:${{ needs.resolve-ref.outputs.sha }}${{ github.event_name == 'push' && format(',{0}/dashboard-backend:latest', steps.meta.outputs.prefix) || '' }}

  build-and-push-dashboard:
    if: github.repository == 'kernelci/dashboard' || github.event_name == 'workflow_dispatch'
    needs: resolve-ref
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0

      - name: Compute image prefix
        id: meta
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute dashboard version
        id: dashboard_version
        run: echo "dashboard_version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dashboard image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dashboard/Dockerfile
          push: true
          build-args: |
            DASHBOARD_VERSION=${{ steps.dashboard_version.outputs.dashboard_version }}
          tags: ${{ steps.meta.outputs.prefix }}/dashboard-frontend:${{ needs.resolve-ref.outputs.sha }}${{ github.event_name == 'push' && format(',{0}/dashboard-frontend:latest', steps.meta.outputs.prefix) || '' }}

  build-and-push-proxy:
    if: github.repository == 'kernelci/dashboard' || github.event_name == 'workflow_dispatch'
    needs: resolve-ref
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Compute image prefix
        id: meta
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push proxy image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/dashboard-proxy:${{ needs.resolve-ref.outputs.sha }}${{ github.event_name == 'push' && format(',{0}/dashboard-proxy:latest', steps.meta.outputs.prefix) || '' }}

  verify:
    if: always()
    needs:
      - resolve-ref
      - build-and-push-backend
      - build-and-push-dashboard
      - build-and-push-proxy
    runs-on: ubuntu-latest
    steps:
      - name: Image publish summary
        run: |
          echo "### Published GHCR Images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: \`${{ needs.resolve-ref.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ----- | ------ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| dashboard-backend | \`${{ needs.build-and-push-backend.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| dashboard-frontend | \`${{ needs.build-and-push-dashboard.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| dashboard-proxy | \`${{ needs.build-and-push-proxy.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
