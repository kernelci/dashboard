volumes:
    backend-data:
    runtime-data:
    static-data:
    dashboard-db-data:

networks:
    public:
    private:

services:
    backend:
        container_name: dashboard_backend_service_staging
        build:
            context: ./backend
        volumes:
            - backend-data:${BACKEND_VOLUME_DIR:-/volume_data}
        env_file:
            - .env
        networks:
            - private
            - public
        ports:
            - 8000:8000
        restart: always
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/dashboard-backend:${IMAGE_TAG:-latest}
        command:
            - poetry
            - run
            - gunicorn
            - kernelCI.wsgi:application
            - --workers=5
            - --forwarded-allow-ips=*
            - --bind=0.0.0.0:8000
            - --timeout=250
        entrypoint: "./utils/docker/backend_entrypoint.sh"
        depends_on:
            redis:
                condition: service_healthy
            dashboard_db:
                condition: service_started
        healthcheck:
            test: ["CMD", "curl", "-f", "-H", "Host: backend", "http://localhost:8000/health/"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s

    ingester:
        container_name: dashboard_ingester_service_staging
        build:
            context: ./backend
        volumes:
            - backend-data:${BACKEND_VOLUME_DIR:-/volume_data} # Directory of the tree names file and other data
            - ${INGESTER_SPOOL_DIR}:/app/spool                 # Directory for ingester to monitor
        env_file:
            - .env
        networks:
            - private
            - public
        environment:
            # Pass down the variable from .env to inside the container
            - INGESTER_METRICS_PORT=${INGESTER_METRICS_PORT:-8002}
        command:
            - poetry
            - run
            - python3
            - manage.py
            - monitor_submissions
            - --spool-dir
            - /app/spool
        restart: always
        depends_on:
            - dashboard_db
        ports:
            - 8002:8002
        profiles: ["with_commands"]

    pending_aggregations_processor:
        container_name: pending_aggregations_processor_service_staging
        build:
            context: ./backend
        env_file:
            - .env
        networks:
            - private
            - public
        environment:
            - PENDING_AGGREGATIONS_METRICS_PORT=${PENDING_AGGREGATIONS_METRICS_PORT:-8003}
        command:
            - poetry
            - run
            - python3
            - manage.py
            - process_pending_aggregations
            - --loop
            - --interval
            - "5"
        restart: always
        depends_on:
            - dashboard_db
        ports:
            - 8003:8001
        profiles: ["with_commands"]

    dashboard_db:
        image: postgres:17
        environment:
            POSTGRES_USER: ${DB_USER:-admin}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
            POSTGRES_DB: ${DB_NAME:-dashboard}
        volumes:
            - dashboard-db-data:/var/lib/postgresql/data
        networks:
            - private

    redis:
        image: redis:8.0-M04-alpine
        restart: always
        networks:
            - private
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    dashboard:
        build:
            context: .
            dockerfile: ./dashboard/Dockerfile
            args:
                DASHBOARD_VERSION: ${DASHBOARD_VERSION:-local-dev}
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/dashboard-frontend:${IMAGE_TAG:-latest}
        volumes:
            - static-data:/data/static

    anubis:
        image: ${ANUBIS_IMAGE:-ghcr.io/techarohq/anubis:v1.25.0}
        restart: always
        networks:
            - public
        environment:
            BIND: ":8923"
            METRICS_BIND: ":9090"
            TARGET: "http://proxy:8080"
            POLICY_FNAME: "/data/cfg/botPolicy.yaml"
            COOKIE_SECURE: ${ANUBIS_COOKIE_SECURE:-false}
        volumes:
            - ./anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
        healthcheck:
            test: ["CMD", "anubis", "--healthcheck"]
            interval: 5s
            timeout: 30s
            retries: 5
            start_period: 500ms

    proxy:
        build: ./proxy
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-local}/dashboard-proxy:${IMAGE_TAG:-latest}
        restart: always
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
            interval: 5s
            timeout: 5s
            retries: 5
        depends_on:
            backend:
                condition: service_started
            dashboard:
                condition: service_started
            anubis:
                condition: service_healthy
        networks:
            - public
        volumes:
            - static-data:/data/static
            - /etc/letsencrypt/live/staging.dashboard.kernelci.org/fullchain.pem:/etc/nginx/ssl/fullchain.pem
            - /etc/letsencrypt/live/staging.dashboard.kernelci.org/privkey.pem:/etc/nginx/ssl/privkey.pem
        ports:
            - ${STAGING_EXTERNAL_HTTP_PORT:-9000}:80
        env_file:
            - .env
