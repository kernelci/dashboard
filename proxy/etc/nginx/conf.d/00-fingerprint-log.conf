# JSON escaping applies to every string, including client-controlled headers.
# Fingerprints come from the connection, never from incoming HTTP headers.
log_format fingerprints escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"remote_port":"$remote_port","connection":"$connection",'
    '"connection_requests":"$connection_requests","request_id":"$request_id",'
    '"request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"referer":"$http_referer",'
    '"user_agent":"$http_user_agent","forwarded_for":"$http_x_forwarded_for",'
    '"tls_protocol":"$ssl_protocol","tls_cipher":"$ssl_cipher",'
    '"tls_alpn":"$ssl_alpn_protocol",'
    '"tls_ja4":"$http_ssl_ja4","tcp_ja4t":"$http_ssl_ja4t"}';
